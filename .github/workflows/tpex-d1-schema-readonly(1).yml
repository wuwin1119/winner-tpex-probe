name: WINNER D1 Daily Quotes Schema Readonly

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect daily_quotes columns without writes
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          url = ('https://api.cloudflare.com/client/v4/accounts/'
                 + os.environ['CF_ACCOUNT_ID'] + '/d1/database/'
                 + os.environ['CF_D1_DATABASE_ID'] + '/query')
          sql = 'PRAGMA table_info("daily_quotes")'
          request = urllib.request.Request(
              url, data=json.dumps({'sql': sql}).encode('utf-8'),
              headers={'Authorization': 'Bearer ' + os.environ['CF_API_TOKEN'],
                       'Content-Type': 'application/json'}, method='POST')
          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as exc:
              print('FAIL: D1 HTTP status', exc.code)
              raise SystemExit(1)
          if not data.get('success'):
              print('FAIL:', json.dumps(data.get('errors', []), ensure_ascii=False))
              raise SystemExit(1)
          result = data.get('result') or []
          rows = result[0].get('results', []) if result else []
          if not rows:
              print('FAIL: daily_quotes columns not returned')
              raise SystemExit(1)
          print('PASS: daily_quotes schema retrieved (read-only)')
          print('COLUMN_COUNT:', len(rows))
          for row in rows:
              print('COLUMN:', row.get('cid'), row.get('name'),
                    'TYPE:', row.get('type'), 'NOT_NULL:', row.get('notnull'),
                    'PK:', row.get('pk'), 'DEFAULT:', row.get('dflt_value'))
          print('PASS: no data modified')
          PY
