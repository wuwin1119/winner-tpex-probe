
name: WINNER D1 TPEx Daily K Coverage Readonly

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check TPEx daily K coverage
        shell: bash
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, urllib.request

          url = (
              "https://api.cloudflare.com/client/v4/accounts/"
              + os.environ["CF_ACCOUNT_ID"]
              + "/d1/database/"
              + os.environ["CF_D1_DATABASE_ID"]
              + "/query"
          )

          def query(sql):
              request = urllib.request.Request(
                  url,
                  data=json.dumps({"sql": sql}).encode(),
                  headers={
                      "Authorization": "Bearer " + os.environ["CF_API_TOKEN"],
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )
              with urllib.request.urlopen(request, timeout=40) as response:
                  data = json.load(response)
              if not data.get("success"):
                  raise RuntimeError(str(data.get("errors")))
              return data["result"][0].get("results", [])

          def show(label, sql):
              result = query(sql)
              print(label + ": " + json.dumps(result, ensure_ascii=False))

          show("TPEx securities", """
              SELECT COUNT(*) AS total
              FROM securities
              WHERE market = '上櫃'
          """)

          show("Daily K summary", """
              SELECT COUNT(*) AS total_rows,
                     COUNT(DISTINCT symbol) AS stock_count,
                     MIN(trade_date) AS first_date,
                     MAX(trade_date) AS last_date
              FROM daily_quotes
              WHERE market = '上櫃'
          """)

          show("Stocks missing daily K", """
              SELECT COUNT(*) AS missing_count
              FROM securities s
              WHERE s.market = '上櫃'
              AND NOT EXISTS (
                  SELECT 1 FROM daily_quotes d
                  WHERE d.market = s.market
                  AND d.symbol = s.symbol
              )
          """)

          show("Missing stock sample", """
              SELECT s.symbol, s.stock_name
              FROM securities s
              WHERE s.market = '上櫃'
              AND NOT EXISTS (
                  SELECT 1 FROM daily_quotes d
                  WHERE d.market = s.market
                  AND d.symbol = s.symbol
              )
              ORDER BY s.symbol
              LIMIT 30
          """)

          show("Duplicate date sample", """
              SELECT symbol, trade_date, COUNT(*) AS n
              FROM daily_quotes
              WHERE market = '上櫃'
              GROUP BY symbol, trade_date
              HAVING COUNT(*) > 1
              LIMIT 20
          """)

          show("Invalid OHLC count", """
              SELECT COUNT(*) AS n
              FROM daily_quotes
              WHERE market = '上櫃'
              AND (
                  open_price IS NULL
                  OR high_price IS NULL
                  OR low_price IS NULL
                  OR close_price IS NULL
                  OR high_price < low_price
                  OR high_price < open_price
                  OR high_price < close_price
                  OR low_price > open_price
                  OR low_price > close_price
              )
          """)

          show("Lowest coverage stocks", """
              SELECT symbol,
                     COUNT(*) AS rows,
                     MIN(trade_date) AS first_date,
                     MAX(trade_date) AS last_date
              FROM daily_quotes
              WHERE market = '上櫃'
              GROUP BY symbol
              ORDER BY rows ASC, symbol ASC
              LIMIT 20
          """)

          print("PASS: SELECT-only; no data modified")
          PY
