name: WINNER TPEx 6148 Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Read official CSV
        run: |
          python - <<'PY'
          import csv, io, urllib.parse, urllib.request
          from decimal import Decimal

          url = (
              "https://www.tpex.org.tw/www/zh-tw/afterTrading/turnover?"
              + urllib.parse.urlencode({
                  "type": "Daily",
                  "date": "2026/11/05",
                  "response": "csv"
              })
          )

          req = urllib.request.Request(
              url, headers={"User-Agent": "Mozilla/5.0"}
          )
          with urllib.request.urlopen(req, timeout=45) as response:
              raw = response.read()

          rows = list(csv.reader(io.StringIO(raw.decode("cp950"))))
          matches = [
              r for r in rows[3:]
              if len(r) >= 6 and r[1].strip() == "6148"
          ]

          assert len(matches) == 1, f"Matches: {len(matches)}"
          r = matches[0]
          print("RAW_6148:", repr(r))

          volume = int(r[3].replace(",", ""))
          issued = int(r[4].replace(",", ""))
          official = Decimal(r[5].strip())

          print("OFFICIAL_PCT:", official)
          print(
              "COMPUTED_PCT:",
              Decimal(volume) * 100 / Decimal(issued)
              if issued else "UNDEFINED"
          )
          print("GT_100:", official > 100)
          PY
