name: WINNER TWSE 10 Stocks Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: pip install requests
      - name: Test 10 stocks
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python winner_twse_incremental.py --limit 10 --delay 1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twse-test-results
          path: cloud_state/
          retention-days: 7
