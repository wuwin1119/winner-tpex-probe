name: WINNER TPEx Daily Archive

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1-5'

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official TPEx turnover
        run: python winner_tpex_daily.py --days 10
      - name: Save TXT files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpex-turnover-${{ github.run_id }}
          path: tpex-turnover/
          if-no-files-found: error
          retention-days: 90
